name: Update Sector Pulse market snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-market.yml"
      - "sector_pulse_updater.py"
      - "snapshot_guard.py"
  schedule:
    # GitHub is a no-cost fallback if the Cloudflare Cron Trigger misses a cycle.
    # The offset avoids GitHub's busiest top-of-hour scheduling window.
    - cron: "2-59/5 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-pulse-market-update
  cancel-in-progress: false

jobs:
  update:
    if: vars.UPDATER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check regular U.S. market hours
        id: market_window
        shell: bash
        run: |
          enabled=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            weekday=$(TZ=America/New_York date +%u)
            market_time=$(TZ=America/New_York date +%H%M)
            if [ "$weekday" -gt 5 ] || [ "$market_time" -lt 0930 ] || [ "$market_time" -gt 1600 ]; then
              enabled=false
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.market_window.outputs.enabled == 'true'

      - uses: actions/setup-python@v6
        if: steps.market_window.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.market_window.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt

      - name: Build snapshot and protect newer published data
        if: steps.market_window.outputs.enabled == 'true'
        id: freshness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          built=false
          publish=false
          for attempt in 1 2 3; do
            echo "Snapshot attempt $attempt of 3"
            if python sector_pulse_updater.py --output snapshot.json; then
              built=true
              if curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --output current-snapshot.json \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$CLOUDFLARE_KV_NAMESPACE_ID/values/snapshot-latest"; then
                decision=$(python snapshot_guard.py \
                  --candidate snapshot.json \
                  --current-file current-snapshot.json)
                publish=${decision#publish=}
                if [ "$publish" = "true" ]; then
                  break
                fi
              else
                echo "Could not read the current KV snapshot; preserving it" >&2
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$built" != "true" ]; then
            echo "All snapshot builds failed" >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish latest successful snapshot
        if: steps.market_window.outputs.enabled == 'true' && steps.freshness.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_KV_NAMESPACE_ID"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @snapshot.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$CLOUDFLARE_KV_NAMESPACE_ID/values/snapshot-latest"
