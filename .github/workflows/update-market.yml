name: Update Sector Pulse market snapshot

on:
  workflow_dispatch:

concurrency:
  group: sector-pulse-market-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: vars.UPDATER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build snapshot and protect newer published data
        id: freshness
        shell: bash
        run: |
          built=false
          publish=false
          for attempt in 1 2 3; do
            echo "Snapshot attempt $attempt of 3"
            if python sector_pulse_updater.py --output snapshot.json; then
              built=true
              decision=$(python snapshot_guard.py \
                --candidate snapshot.json \
                --current-url "https://sector-pulse-api.andrew-2f4.workers.dev/api/contributions")
              publish=${decision#publish=}
              if [ "$publish" = "true" ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$built" != "true" ]; then
            echo "All snapshot builds failed" >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish latest successful snapshot
        if: steps.freshness.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_KV_NAMESPACE_ID"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @snapshot.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$CLOUDFLARE_KV_NAMESPACE_ID/values/snapshot-latest"
